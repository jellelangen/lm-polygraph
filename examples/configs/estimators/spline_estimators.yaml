# Baselines
- name: MaximumSequenceProbability
- name: Perplexity
- name: MeanTokenEntropy

# ──────────────────────────────────────────────────────────────
# Qwen2.5-1.5B: 28 layers, indexed 0–27
# 0 = first (closest to input), 27 = last (closest to output)
# 0.5B results showed last layer was best, so we sample densely
# near the end and sparsely near the start.
# Layers: 0, 4, 9, 14, 19, 23, 27
# ──────────────────────────────────────────────────────────────

# SplineQuantile: 3 quantiles × 7 layers = 21 estimators

# q=0.05
- name: SplineQuantileSequence
  cfg: { layer_idx: 0, quantile: 0.05, agg: "mean" }
- name: SplineQuantileSequence
  cfg: { layer_idx: 4, quantile: 0.05, agg: "mean" }
- name: SplineQuantileSequence
  cfg: { layer_idx: 9, quantile: 0.05, agg: "mean" }
