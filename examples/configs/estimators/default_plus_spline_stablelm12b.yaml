# ══════════════════════════════════════════════════════════════
# DEFAULT BASELINES (matching LM-Polygraph paper, Table 7)
# ══════════════════════════════════════════════════════════════

# --- Information-based (single-pass, fast) ---
- name: MaximumSequenceProbability
- name: Perplexity
- name: MeanTokenEntropy
- name: MeanPointwiseMutualInformation
- name: SelfCertainty
- name: MeanConditionalPointwiseMutualInformation
- name: ClaimConditionedProbability
- name: TokenSAR
- name: RenyiNeg
- name: FisherRao

# --- Reflexive ---
- name: PTrue
- name: PTrueSampling

# --- Sampling-based (expensive) ---
- name: MonteCarloSequenceEntropy
- name: MonteCarloNormalizedSequenceEntropy
- name: LexicalSimilarity
  cfg:
    metric: "rougeL"
- name: LexicalSimilarity
  cfg:
    metric: "BLEU"
- name: NumSemSets
- name: EigValLaplacian
  cfg:
    similarity_score: "NLI_score"
    affinity: "entail"
- name: EigValLaplacian
  cfg:
    similarity_score: "Jaccard_score"
- name: DegMat
  cfg:
    similarity_score: "NLI_score"
    affinity: "entail"
- name: DegMat
  cfg:
    similarity_score: "Jaccard_score"
- name: Eccentricity
  cfg:
    similarity_score: "NLI_score"
    affinity: "entail"
- name: Eccentricity
  cfg:
    similarity_score: "Jaccard_score"
- name: SemanticEntropy
- name: SAR
- name: SentenceSAR



# SplineQuantile
- name: SplineQuantileSequence
  cfg: { layer_idx: 18, quantile: 0.1, agg: "mean" }
- name: SplineQuantileSequence
  cfg: { layer_idx: 19, quantile: 0.1, agg: "mean" }
- name: SplineQuantileSequence
  cfg: { layer_idx: 20, quantile: 0.1, agg: "mean" }
  
# SplineLocalComplexity
- name: SplineLocalComplexitySequence
  cfg: { layer_idx: 18, r: 0.1, agg: "mean" }
- name: SplineLocalComplexitySequence
  cfg: { layer_idx: 19, r: 0.1, agg: "mean" }
- name: SplineLocalComplexitySequence
  cfg: { layer_idx: 20, r: 0.1, agg: "mean" }


# SplineHardMin
- name: SplineHardMinSequence
  cfg: { layer_idx: 24, agg: "mean" }
- name: SplineHardMinSequence
  cfg: { layer_idx: 25, agg: "mean" }
- name: SplineHardMinSequence
  cfg: { layer_idx: 26, agg: "mean" }