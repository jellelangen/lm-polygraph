# ══════════════════════════════════════════════════════════════
# DEFAULT BASELINES (matching LM-Polygraph paper, Table 7)
# ══════════════════════════════════════════════════════════════

# --- Information-based (single-pass, fast) ---
- name: MaximumSequenceProbability
- name: Perplexity
- name: MeanTokenEntropy
- name: MeanPointwiseMutualInformation
- name: SelfCertainty
- name: MeanConditionalPointwiseMutualInformation
- name: ClaimConditionedProbability
- name: TokenSAR
- name: RenyiNeg
- name: FisherRao

# --- Reflexive ---
- name: PTrue
- name: PTrueSampling

# --- Sampling-based (expensive: ~10 extra generation passes) ---
- name: MonteCarloSequenceEntropy
- name: MonteCarloNormalizedSequenceEntropy
- name: LexicalSimilarity
  cfg:
    metric: "rougeL"
- name: LexicalSimilarity
  cfg:
    metric: "BLEU"
- name: NumSemSets
- name: EigValLaplacian
  cfg:
    similarity_score: "NLI_score"
    affinity: "entail"
- name: EigValLaplacian
  cfg:
    similarity_score: "Jaccard_score"
- name: DegMat
  cfg:
    similarity_score: "NLI_score"
    affinity: "entail"
- name: DegMat
  cfg:
    similarity_score: "Jaccard_score"
- name: Eccentricity
  cfg:
    similarity_score: "NLI_score"
    affinity: "entail"
- name: Eccentricity
  cfg:
    similarity_score: "Jaccard_score"
- name: SemanticEntropy
- name: SAR
- name: SentenceSAR


# SplineQuantile
- name: SplineQuantileSequence
  cfg: { layer_idx: 9, quantile: 0.1, agg: "mean" }
- name: SplineQuantileSequence
  cfg: { layer_idx: 10, quantile: 0.1, agg: "mean" }
- name: SplineQuantileSequence
  cfg: { layer_idx: 11, quantile: 0.1, agg: "mean" }

# SplineLocalComplexity
- name: SplineLocalComplexitySequence
  cfg: { layer_idx: 9, r: 0.1, agg: "mean" }
- name: SplineLocalComplexitySequence
  cfg: { layer_idx: 10, r: 0.1, agg: "mean" }
- name: SplineLocalComplexitySequence
  cfg: { layer_idx: 11, r: 0.1, agg: "mean" }


# SplineHardMin
- name: SplineHardMinSequence
  cfg: { layer_idx: 8, agg: "mean" }
- name: SplineHardMinSequence
  cfg: { layer_idx: 9, agg: "mean" }
- name: SplineHardMinSequence
  cfg: { layer_idx: 10, agg: "mean" }
